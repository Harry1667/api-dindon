<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>叮咚到號 — 醫院看診進度查詢</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root { --green: #06C755; --bg: #7494C0; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: #E8ECF0;
    height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.phone-frame {
    width: 100%; max-width: 420px; height: 100dvh;
    background: var(--bg);
    display: flex; flex-direction: column; overflow: hidden;
}
@media (min-width: 500px) {
    .phone-frame {
        height: 780px; border-radius: 32px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        border: 8px solid #2C2C2C;
    }
}

.chat-header {
    background: var(--green); color: white;
    padding: 14px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0;
}
.chat-header .avatar {
    width: 42px; height: 42px; border-radius: 50%; background: white;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
}
.chat-header .info h3 { font-size: 16px; }
.chat-header .info span { font-size: 11px; opacity: 0.85; }

.chat-body {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 8px;
    -webkit-overflow-scrolling: touch;
}

.msg-row { display: flex; gap: 8px; max-width: 88%; animation: msgIn 0.25s ease-out; }
.msg-row.bot { align-self: flex-start; }
.msg-row.user { align-self: flex-end; flex-direction: row-reverse; }

.bubble-avatar {
    width: 32px; height: 32px; border-radius: 50%; background: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
}

.bubble {
    padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.6;
    white-space: pre-wrap; word-break: break-word; position: relative;
}
.bot .bubble { background: white; color: #333; border-bottom-left-radius: 4px; }
.user .bubble { background: var(--green); color: white; border-bottom-right-radius: 4px; }

.copy-btn {
    display: block; margin-top: 6px; background: none; border: 1px solid #CCC;
    border-radius: 8px; padding: 2px 10px; font-size: 11px; color: #999; cursor: pointer;
}
.copy-btn.copied { border-color: var(--green); color: var(--green); }

@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.typing .bubble::after { content: '⋯'; animation: dots 1.2s infinite; }
@keyframes dots { 0%,20%{content:'⋯'} 40%{content:'⋯⋯'} 60%{content:'⋯⋯⋯'} }

.chat-input {
    display: flex; gap: 8px; padding: 10px 12px;
    background: #F7F8FA; flex-shrink: 0; border-top: 1px solid #E0E0E0;
}
.chat-input input {
    flex: 1; border: 1px solid #DDD; border-radius: 20px;
    padding: 10px 16px; font-size: 15px; outline: none; background: white;
}
.chat-input input:focus { border-color: var(--green); }
.chat-input button {
    background: var(--green); color: white; border: none; border-radius: 50%;
    width: 40px; height: 40px; font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.chat-input button:active { transform: scale(0.92); }

.num-row {
    display: flex; gap: 4px; padding: 6px 12px;
    background: #F7F8FA; border-top: 1px solid #E0E0E0; flex-shrink: 0;
}
.num-btn {
    flex: 1; border: 1px solid #DDD; border-radius: 8px;
    background: white; font-size: 16px; font-weight: 500; color: #333;
    padding: 8px 0; cursor: pointer; text-align: center;
}
.num-btn:active { background: var(--green); color: white; }
</style>
</head>
<body>

<div class="phone-frame">
    <div class="chat-header">
        <div class="avatar">🏥</div>
        <div class="info">
            <h3>叮咚到號</h3>
            <span>即時看診進度查詢</span>
        </div>
    </div>
    <div class="chat-body" id="chatBody" onclick="document.getElementById('msgInput').blur()"></div>
    <div class="num-row" id="numRow">
        <button class="num-btn" onclick="tapNum('0')">0</button>
        <button class="num-btn" onclick="tapNum('1')">1</button>
        <button class="num-btn" onclick="tapNum('2')">2</button>
        <button class="num-btn" onclick="tapNum('3')">3</button>
        <button class="num-btn" onclick="tapNum('4')">4</button>
        <button class="num-btn" onclick="tapNum('5')">5</button>
        <button class="num-btn" onclick="tapNum('6')">6</button>
        <button class="num-btn" onclick="tapNum('7')">7</button>
        <button class="num-btn" onclick="tapNum('8')">8</button>
        <button class="num-btn" onclick="tapNum('9')">9</button>
    </div>
    <div class="num-row" id="numRowMulti" style="display:none;">
        <button class="num-btn" onclick="tapMulti('0')">0</button>
        <button class="num-btn" onclick="tapMulti('1')">1</button>
        <button class="num-btn" onclick="tapMulti('2')">2</button>
        <button class="num-btn" onclick="tapMulti('3')">3</button>
        <button class="num-btn" onclick="tapMulti('4')">4</button>
        <button class="num-btn" onclick="tapMulti('5')">5</button>
        <button class="num-btn" onclick="tapMulti('6')">6</button>
        <button class="num-btn" onclick="tapMulti('7')">7</button>
        <button class="num-btn" onclick="tapMulti('8')">8</button>
        <button class="num-btn" onclick="tapMulti('9')">9</button>
        <button class="num-btn" onclick="tapMultiDel()" style="font-size:14px;">⌫</button>
    </div>
    <div class="chat-input">
        <input type="text" id="msgInput" placeholder="輸入數字或醫院名稱..." autocomplete="off">
        <button onclick="sendMessage()">▶</button>
    </div>
</div>

<script>
const API_BASE = window.location.origin;
const chatBody = document.getElementById('chatBody');

let _sending = false;  // 防重複點擊

// === Web Audio 音效 ===
let _audioCtx = null;
function getAudio() {
    if (!_audioCtx) {
        try {
            _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) { return null; }
    }
    if (_audioCtx.state === 'suspended') _audioCtx.resume();
    return _audioCtx;
}

// 通用單音
function _beep(freq, dur, type = 'sine', vol = 0.15, delay = 0) {
    const ctx = getAudio();
    if (!ctx) return;
    const t0 = ctx.currentTime + delay;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(vol, t0 + 0.005);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
}

// 1. 打字聲（短促 click）
function playTap() { _beep(1800, 0.04, 'square', 0.06); }

// 2. 送出訊息（輕一聲）
function playSend() { _beep(880, 0.08, 'sine', 0.10); }

// 3. 號碼更新 ding（單音清脆）
function playDing() { _beep(1320, 0.25, 'triangle', 0.18); }

// 4. 快到/到我 dingdong（雙音）
function playDingDong() {
    _beep(1320, 0.22, 'triangle', 0.22, 0);
    _beep(990, 0.32, 'triangle', 0.22, 0.18);
}

function tapNum(n) {
    if (_sending) return;
    playTap();
    msgInput.value = n;
    sendMessage();
}

function tapMulti(n) {
    playTap();
    msgInput.value += n;
    msgInput.focus();
}

function tapMultiDel() {
    playTap();
    msgInput.value = msgInput.value.slice(0, -1);
}

function setMultiMode(on) {
    document.getElementById('numRow').style.display = on ? 'none' : 'flex';
    document.getElementById('numRowMulti').style.display = on ? 'flex' : 'none';
    if (on) {
        msgInput.value = '';
        msgInput.placeholder = '輸入掛號號碼...';
    } else {
        msgInput.placeholder = '輸入數字或醫院名稱...';
    }
}

const msgInput = document.getElementById('msgInput');

let hospitals = [];
let menuState = 'main';
let menuOptions = {};
let lastHospital = null;
let lastProgressData = [];
let pageItems = [];
let pageIndex = 0;
let pageContext = null;

// 返回堆疊：按 0 逐層返回
let navStack = [];

// 追蹤（多醫師同時追蹤，最多 3 位）
let pendingTrack = null;       // 正在設定中（等待輸入掛號號碼）
let tracks = [];               // 追蹤中的清單
const MAX_TRACKS = 3;
let waitingForNumber = false;  // 等待用戶輸入掛號號碼

// 用戶資料
const urlParams = new URLSearchParams(location.search);
if (urlParams.get('uid')) localStorage.setItem('line_user_id', urlParams.get('uid'));
let lineUserId = localStorage.getItem('line_user_id') || '';
let userFavorites = [];
let userArea = localStorage.getItem('user_area') || '';

// === 初始化 ===
async function init() {
    try {
        const resp = await fetch(`${API_BASE}/api/hospitals`);
        const data = await resp.json();
        hospitals = data.hospitals || [];
    } catch (e) {
        addBotMsg('無法連線，請稍後再試');
        return;
    }
    await loadFavorites();
    await showMainMenu();
}

async function loadFavorites() {
    if (!lineUserId) return;
    try {
        const resp = await fetch(`${API_BASE}/api/liff/favorites/${lineUserId}`);
        const data = await resp.json();
        if (data.favorites && data.favorites.length > 0) userFavorites = data.favorites;
    } catch (e) {}
}

// === 主選單 ===
async function showMainMenu() {
    navStack = [];
    menuState = 'main';
    menuOptions = { '2': 'list_area' };

    await loadFavorites();

    let lines = [];
    if (tracks.length > 0) {
        const label = tracks.length === 1 ? '1 查追蹤進度' : `1 查追蹤進度 (${tracks.length})`;
        lines.push(label);
        menuOptions['1'] = 'check_tracking';
    }
    lines.push('2 醫院列表');
    lines.push('');

    const maxSlots = 5;
    const usedCodes = new Set();
    const slots = [];

    for (const f of userFavorites) {
        if (slots.length >= maxSlots) break;
        const h = hospitals.find(x => x.code === f.hospital_code);
        if (h && !usedCodes.has(h.code)) {
            slots.push({ hospital: h, name: f.hospital_name, star: true });
            usedCodes.add(h.code);
        }
    }

    if (slots.length < maxSlots) {
        const areas = groupByArea();
        if (userArea && areas[userArea]) {
            for (const h of areas[userArea]) {
                if (slots.length >= maxSlots) break;
                if (!usedCodes.has(h.code)) {
                    slots.push({ hospital: h, name: h.name, star: false });
                    usedCodes.add(h.code);
                }
            }
        }
        if (slots.length < maxSlots) {
            const taipei = areas['台北市'] || [];
            for (const h of taipei) {
                if (slots.length >= maxSlots) break;
                if (!usedCodes.has(h.code)) {
                    slots.push({ hospital: h, name: h.name, star: false });
                    usedCodes.add(h.code);
                }
            }
        }
    }

    slots.forEach((s, idx) => {
        const num = idx + 4;
        const mark = s.star ? '⭐' : '';
        lines.push(`${num} ${mark}${s.name}`);
        menuOptions[String(num)] = { type: 'hospital', hospital: s.hospital };
    });

    addBotMsg(lines.join('\n'));
}

// === 分頁顯示 ===
function showPage(items, state, title) {
    pageItems = items;
    pageContext = { state, title };
    pageIndex = 0;
    renderPage();
}

function renderPage() {
    const perPage = 8;
    const slice = pageItems.slice(pageIndex, pageIndex + perPage);
    const total = pageItems.length;
    const pageNum = Math.floor(pageIndex / perPage) + 1;
    const totalPages = Math.ceil(total / perPage);

    menuOptions = {};
    menuState = pageContext.state;

    let lines = [];
    lines.push(totalPages > 1 ? `${pageContext.title} (${pageNum}/${totalPages})` : pageContext.title);
    lines.push('');

    slice.forEach((item, idx) => {
        const num = idx + 1;
        lines.push(`${num} ${item.label}`);
        menuOptions[String(num)] = item.action;
    });

    lines.push('');
    if (total > perPage) lines.push('9 下一頁');
    lines.push('0 返回');

    addBotMsg(lines.join('\n'));
}

function nextPage() {
    pageIndex += 8;
    if (pageIndex >= pageItems.length) pageIndex = 0;
    renderPage();
}

// === 發送訊息 ===
async function sendMessage() {
    if (_sending) return;
    const text = msgInput.value.trim();
    if (!text) return;
    _sending = true;
    playSend();
    addUserMsg(text);
    msgInput.value = '';
    await new Promise(r => setTimeout(r, 500));
    try {
        await processMessage(text);
    } catch (e) {
        console.error('processMessage error:', e);
        addBotMsg('查詢失敗，請稍後再試\n\n0 返回');
        menuState = 'error';
    }
    _sending = false;
}

// === 處理訊息 ===
async function processMessage(text) {
    const m = text.trim();

    // 返回（追蹤中按 0 只回主頁，不停止追蹤）
    if (m === '0' || m === '回') {
        if (waitingForNumber) {
            waitingForNumber = false;
            setMultiMode(false);
            pendingTrack = null;
        }
        if (navStack.length > 0) {
            const back = navStack.pop();
            await back();
        } else {
            await showMainMenu();
        }
        return;
    }

    // 等待輸入掛號號碼
    if (waitingForNumber) {
        if (m === '999') {
            waitingForNumber = false;
            setMultiMode(false);
            startTracking(null);
            return;
        }
        const num = parseInt(m);
        if (num > 0) {
            waitingForNumber = false;
            setMultiMode(false);
            startTracking(num);
            return;
        }
        addBotMsg('請輸入掛號號碼（數字）\n或輸入 999 僅追蹤');
        return;
    }

    // 下一頁
    if (m === '9' && pageItems.length > 8) {
        nextPage();
        return;
    }

    // 數字選擇
    if (menuOptions[m]) {
        const action = menuOptions[m];

        if (action === 'check_tracking') {
            await checkTrackingNow();
            return;
        }
        if (typeof action === 'object' && action.type === 'track_view') {
            await showTrackDetail(action.track);
            return;
        }
        if (typeof action === 'object' && action.type === 'stop_track') {
            stopTrack(action.track);
            addBotMsg(`${action.track.doctor} 追蹤已停止`);
            await new Promise(r => setTimeout(r, 300));
            await showMainMenu();
            return;
        }
        if (action === 'list_area') {
            navStack.push(() => showMainMenu());
            showAreaMenu();
            return;
        }

        if (typeof action === 'object' && action.type === 'area') {
            navStack.push(() => showAreaMenu());
            showHospitalsByArea(action.area, action.list);
            return;
        }

        if (typeof action === 'object' && action.type === 'hospital') {
            navStack.push(() => showMainMenu());
            await fetchProgress(action.hospital);
            return;
        }

        if (typeof action === 'object' && action.type === 'dept') {
            navStack.push(() => showDeptList(lastHospital));
            showDeptProgress(lastHospital, action.dept);
            return;
        }

        // 選醫師 → 開始追蹤流程
        if (typeof action === 'object' && action.type === 'doctor') {
            const doc = action.doctor;
            // 已達追蹤上限
            if (tracks.length >= MAX_TRACKS) {
                addBotMsg(`已達追蹤上限 ${MAX_TRACKS} 位\n請先停止其他追蹤\n\n0 返回`);
                return;
            }
            // 同診間已在追蹤
            const exists = tracks.find(t =>
                t.hospitalCode === lastHospital.code &&
                t.doctor === doc.doctor_name &&
                t.room === doc.clinic_room
            );
            if (exists) {
                addBotMsg(`${doc.doctor_name} ${doc.clinic_room} 已在追蹤中\n\n0 返回`);
                return;
            }
            pendingTrack = {
                id: Date.now() + Math.random(),
                hospital: lastHospital,
                hospitalCode: lastHospital.code,
                dept: doc.department,
                doctor: doc.doctor_name,
                room: doc.clinic_room,
                currentNumber: doc.current_number,
                userNumber: null,
                intervalId: null,
                skippedRemindCount: 0,
                skippedTimerId: null,
            };
            waitingForNumber = true;
            setMultiMode(true);
            addBotMsg(
                `${doc.doctor_name} ${doc.clinic_room}\n` +
                `目前看診：#${doc.current_number}\n\n` +
                `請輸入您的掛號號碼\n或輸入 999 僅追蹤\n\n0 返回`
            );
            return;
        }
    }

    // 文字輸入：找醫院
    if (menuState === 'wait_hospital' || menuState === 'main') {
        const hospital = findHospital(m);
        if (hospital) {
            navStack.push(() => showMainMenu());
            await fetchProgress(hospital);
            return;
        }
        const matched = hospitals.filter(h => h.name.includes(m));
        if (matched.length > 0) {
            navStack.push(() => showMainMenu());
            showSearchResults(matched);
            return;
        }
        addBotMsg(`找不到「${m}」\n0 返回`);
        return;
    }

    // 文字輸入：症狀
    if (menuState === 'wait_symptom') {
        await searchSymptom(m);
        return;
    }

    // 不認識的輸入 → 回主選單
    await showMainMenu();
}

// === 地區選單 ===
function showAreaMenu() {
    const areas = groupByArea();
    const items = [];
    for (const [area, list] of Object.entries(areas)) {
        if (list.length === 0) continue;
        items.push({ label: `${area}(${list.length})`, action: { type: 'area', area, list } });
    }
    showPage(items, 'area', '選擇地區');
}

function showHospitalsByArea(area, list) {
    userArea = area;
    localStorage.setItem('user_area', area);
    const items = list.map(h => ({ label: h.name, action: { type: 'hospital', hospital: h } }));
    showPage(items, 'hospital_list', area);
}

function showSearchResults(matched) {
    const items = matched.map(h => ({ label: h.name, action: { type: 'hospital', hospital: h } }));
    showPage(items, 'search_result', `找到${matched.length}間`);
}

// === 查看診進度 ===
async function fetchProgress(hospital) {
    lastHospital = hospital;

    if (lineUserId) {
        fetch(`${API_BASE}/api/liff/favorite`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ line_user_id: lineUserId, hospital_code: hospital.code, hospital_name: hospital.name }),
        }).catch(() => {});
    }

    const resp = await fetch(`${API_BASE}/api/progress/${hospital.code}`);
    const data = await resp.json();

    if (!data.data || data.data.length === 0) {
        menuOptions = {};
        menuState = 'no_data';
        addBotMsg(`${hospital.name}\n目前無看診資料\n\n0 返回`);
        return;
    }

    lastProgressData = data.data;
    await showDeptList(hospital);
}

async function showDeptList(hospital) {
    const depts = [...new Set(lastProgressData.map(r => r.department))].sort();

    let favDepts = [];
    if (lineUserId) {
        try {
            const resp = await fetch(`${API_BASE}/api/liff/favorites/${lineUserId}?hospital_code=${hospital.code}`);
            const data = await resp.json();
            favDepts = (data.favorites || []).map(f => f.department);
        } catch (e) {}
    }

    const sorted = [];
    for (const d of favDepts) { if (depts.includes(d)) sorted.push(d); }
    for (const d of depts) { if (!sorted.includes(d)) sorted.push(d); }

    const items = sorted.map(dept => {
        const count = lastProgressData.filter(r => r.department === dept).length;
        const isFav = favDepts.includes(dept);
        return {
            label: `${isFav ? '⭐' : ''}${dept}(${count})`,
            action: { type: 'dept', dept },
        };
    });

    showPage(items, 'dept_list', hospital.name);
}

function showDeptProgress(hospital, dept) {
    if (lineUserId) {
        fetch(`${API_BASE}/api/liff/favorite`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ line_user_id: lineUserId, hospital_code: hospital.code, hospital_name: hospital.name, department: dept }),
        }).catch(() => {});
    }

    const results = lastProgressData.filter(r => r.department === dept);
    if (results.length === 0) {
        menuOptions = {};
        menuState = 'progress';
        addBotMsg(`${dept} 目前無資料\n\n0 返回`);
        return;
    }

    const items = results.map(it => {
        let num = `#${it.current_number}`;
        if (it.is_current_skipped) num += '(過)';
        const room = it.clinic_room || '';
        return {
            label: `${it.doctor_name} ${room} ${num}`,
            action: { type: 'doctor', doctor: it },
        };
    });

    showPage(items, 'progress', `${hospital.name} ${dept}`);
}

// === 追蹤看診號碼（多醫師） ===

// 把 pendingTrack 放進 tracks 陣列，啟動輪詢
function startTracking(userNumber) {
    if (!pendingTrack) return;
    if (tracks.length >= MAX_TRACKS) {
        addBotMsg(`已達追蹤上限 ${MAX_TRACKS} 位`);
        pendingTrack = null;
        return;
    }
    const track = pendingTrack;
    pendingTrack = null;
    track.userNumber = userNumber;
    track.intervalId = setInterval(() => pollTracking(track), 30000);
    tracks.push(track);

    menuState = 'tracking';
    menuOptions = {};
    navStack = [];

    const cur = track.currentNumber;
    const next = cur + 1;
    let msg = `開始追蹤\n`;
    msg += `醫院：${track.hospital.name}\n`;
    msg += `科別：${track.dept}\n`;
    msg += `醫生：${track.doctor}\n`;
    msg += `診間：${track.room}\n`;
    msg += `目前號碼：#${cur}\n`;
    msg += `下一號：#${next}`;
    if (userNumber) {
        const remaining = userNumber - cur;
        if (remaining > 0) {
            msg += `\n\n您是 ${userNumber} 號，前面還有約 ${remaining} 位`;
        } else {
            msg += `\n\n您是 ${userNumber} 號，已到或過號`;
        }
    }
    msg += `\n\n每 30 秒自動更新 (追蹤中 ${tracks.length}/${MAX_TRACKS})\n0 回主頁`;
    addBotMsg(msg);
}

// 點主頁「查追蹤進度」
async function checkTrackingNow() {
    if (tracks.length === 0) {
        addBotMsg('目前沒有追蹤');
        return;
    }
    if (tracks.length === 1) {
        await showTrackDetail(tracks[0]);
        return;
    }
    showTrackList();
}

// 多筆追蹤時顯示清單
function showTrackList() {
    menuState = 'track_list';
    menuOptions = {};
    let lines = [`追蹤中 (${tracks.length}/${MAX_TRACKS})`, ''];
    tracks.forEach((t, i) => {
        const num = i + 1;
        const cur = t.currentNumber;
        const un = t.userNumber;
        const status = un ? `#${cur} / 您${un}` : `#${cur}`;
        lines.push(`${num} ${t.doctor} ${t.room} ${status}`);
        menuOptions[String(num)] = { type: 'track_view', track: t };
    });
    lines.push('');
    lines.push('0 回主頁');
    addBotMsg(lines.join('\n'));
}

// 顯示某筆追蹤的詳細
async function showTrackDetail(track) {
    if (!tracks.includes(track)) {
        addBotMsg('此追蹤已結束');
        return;
    }
    try {
        const resp = await fetch(`${API_BASE}/api/progress/${track.hospitalCode}`);
        const data = await resp.json();
        if (!data.data) { addBotMsg('查詢失敗'); return; }
        const found = data.data.find(d =>
            d.doctor_name === track.doctor && d.clinic_room === track.room
        );
        if (!found) {
            addBotMsg(`${track.doctor} 看診已結束`);
            stopTrack(track);
            return;
        }
        track.currentNumber = found.current_number;
        const cur = found.current_number;
        const next = cur + 1;
        let msg = `追蹤中\n`;
        msg += `醫院：${track.hospital.name}\n`;
        msg += `科別：${track.dept}\n`;
        msg += `醫生：${track.doctor}\n`;
        msg += `診間：${track.room}\n`;
        msg += `目前號碼：#${cur}`;
        if (found.is_current_skipped) msg += '(過號)';
        msg += `\n下一號：#${next}`;

        if (track.userNumber) {
            const un = track.userNumber;
            if (cur === un) {
                msg += `\n\n🔔 輪到您了！${un} 號正在叫號`;
            } else if (cur > un) {
                msg += `\n\n⚠️ 您是 ${un} 號，已過號`;
            } else {
                msg += `\n\n您是 ${un} 號，還剩約 ${un - cur} 位`;
            }
        }

        msg += '\n\n7 停止此追蹤\n0 回主頁';
        menuState = 'tracking_detail';
        menuOptions = { '7': { type: 'stop_track', track } };
        addBotMsg(msg);
    } catch (e) {
        addBotMsg('查詢失敗');
    }
}

// 30 秒輪詢（每筆 track 自己跑自己的）
async function pollTracking(track) {
    if (!tracks.includes(track)) return;
    try {
        const resp = await fetch(`${API_BASE}/api/progress/${track.hospitalCode}`);
        const data = await resp.json();
        if (!data.data) return;

        const found = data.data.find(d =>
            d.doctor_name === track.doctor && d.clinic_room === track.room
        );
        if (!found) {
            addBotMsg(`${track.doctor} ${track.room} 看診已結束`);
            stopTrack(track);
            return;
        }

        const prev = track.currentNumber;
        track.currentNumber = found.current_number;

        // 號碼沒變就不推播
        if (found.current_number === prev) return;

        // 過號 → 切到每分鐘提醒
        if (track.userNumber && found.current_number > track.userNumber) {
            startSkippedReminder(track);
            return;
        }

        let msg = `${track.doctor} ${track.room}\n目前：#${found.current_number}`;
        if (found.is_current_skipped) msg += '(過號)';

        let soundType = 'ding';

        if (track.userNumber) {
            const un = track.userNumber;
            if (found.current_number === un) {
                msg += `\n\n🔔 輪到您了！${un} 號正在叫號！`;
                soundType = 'dingdong';
                stopTrack(track);
            } else {
                const remaining = un - found.current_number;
                msg += `\n\n您是 ${un} 號，還剩約 ${remaining} 位`;
                if (remaining <= 2) soundType = 'dingdong';
            }
        }

        if (soundType === 'dingdong') playDingDong();
        else playDing();

        addBotMsg(msg);
    } catch (e) {
        console.error('pollTracking error:', e);
    }
}

// 停止某筆追蹤
function stopTrack(track) {
    if (!track) return;
    if (track.intervalId) clearInterval(track.intervalId);
    if (track.skippedTimerId) clearInterval(track.skippedTimerId);
    const idx = tracks.indexOf(track);
    if (idx >= 0) tracks.splice(idx, 1);
}

// 停止全部追蹤（離開頁面用）
function stopAllTracks() {
    tracks.forEach(t => {
        if (t.intervalId) clearInterval(t.intervalId);
        if (t.skippedTimerId) clearInterval(t.skippedTimerId);
    });
    tracks = [];
}

// 過號後的提醒：每分鐘 1 次，最多 3 次（per track）
function startSkippedReminder(track) {
    if (!track || track.skippedTimerId) return;
    if (track.intervalId) {
        clearInterval(track.intervalId);
        track.intervalId = null;
    }
    track.skippedRemindCount = 0;
    sendSkippedReminder(track);
    track.skippedTimerId = setInterval(() => sendSkippedReminder(track), 60000);
}

function sendSkippedReminder(track) {
    if (!track || !tracks.includes(track)) return;
    track.skippedRemindCount++;
    const n = track.skippedRemindCount;
    const un = track.userNumber;
    addBotMsg(
        `⚠️ 您是 ${un} 號，已過號\n` +
        `${track.doctor} ${track.room}\n` +
        `提醒 ${n}/3`
    );
    playDingDong();
    if (n >= 3) {
        stopTrack(track);
        addBotMsg(`${track.doctor} 追蹤已結束`);
    }
}

// === 症狀查科別 ===
async function searchSymptom(query) {
    const resp = await fetch(`${API_BASE}/api/guide/which-department?q=${encodeURIComponent(query)}`);
    const data = await resp.json();

    if (!data.results || data.results.length === 0) {
        addBotMsg(`找不到「${query}」相關科別\n建議到掛號櫃台詢問\n\n0 返回`);
        return;
    }

    let lines = [`「${query}」建議掛：`];
    const seen = new Set();
    for (const r of data.results) {
        if (seen.has(r.department)) continue;
        seen.add(r.department);
        lines.push(`• ${r.department} - ${r.disease}`);
    }
    lines.push('\n0 返回');
    menuState = 'symptom_result';
    menuOptions = {};
    addBotMsg(lines.join('\n'));
}

// === 找醫院 ===
function findHospital(text) {
    let found = hospitals.find(h => text.includes(h.name));
    if (found) return found;

    const aliases = {
        '台大': 'ntuh', '台大醫院': 'ntuh',
        '台大癌醫': 'ntuh-cancer', '癌醫': 'ntuh-cancer',
        '台大兒童': 'ntuh-children',
        '榮總': 'tpvgh', '台北榮總': 'tpvgh', '北榮': 'tpvgh',
        '台中榮總': 'tcvgh', '中榮': 'tcvgh',
        '三總': 'tsgh', '三軍': 'tsgh',
        '長庚': 'changgung-linkou', '林口長庚': 'changgung-linkou',
        '台北長庚': 'changgung-taipei',
        '高雄長庚': 'changgung-kaohsiung',
        '國泰': 'cathay', '國泰醫院': 'cathay',
        '馬偕': 'mackay-taipei', '馬偕醫院': 'mackay-taipei',
        '新光': 'shinkong', '新光醫院': 'shinkong',
        '萬芳': 'wanfang', '萬芳醫院': 'wanfang',
        '亞東': 'femh', '亞東醫院': 'femh',
        '振興': 'chgh', '振興醫院': 'chgh',
        '慈濟': 'tzuchi-taipei',
        '輔大': 'fjuh', '輔大醫院': 'fjuh',
    };
    for (const [alias, code] of Object.entries(aliases)) {
        if (text.includes(alias)) return hospitals.find(h => h.code === code);
    }
    return null;
}

// === 地區分組 ===
function groupByArea() {
    const groups = { '台北市': [], '新北市': [], '基隆': [], '桃園': [], '台中': [], '雲嘉': [], '高雄': [] };
    for (const h of hospitals) {
        const n = h.name;
        if (n.includes('台大') || n.includes('三軍') || n.includes('榮總') || n.includes('台北長庚') ||
            n.includes('國泰醫院') || n.includes('馬偕醫院(台北') || n.includes('新光') ||
            n.includes('萬芳') || n.includes('振興') || n.includes('台大癌醫') || n.includes('台大兒童'))
            groups['台北市'].push(h);
        else if (n.includes('亞東') || n.includes('慈濟') || n.includes('淡水') || n.includes('臺北醫院') ||
                 n.includes('汐止') || n.includes('土城') || n.includes('新北') || n.includes('輔大'))
            groups['新北市'].push(h);
        else if (n.includes('基隆')) groups['基隆'].push(h);
        else if (n.includes('林口') || n.includes('桃園')) groups['桃園'].push(h);
        else if (n.includes('台中') || n.includes('豐原')) groups['台中'].push(h);
        else if (n.includes('雲林') || n.includes('嘉義')) groups['雲嘉'].push(h);
        else if (n.includes('高雄') || n.includes('鳳山')) groups['高雄'].push(h);
    }
    return groups;
}

// === UI ===
function addBotMsg(text) {
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    const plainText = text;
    row.innerHTML = `<div class="bubble-avatar">🏥</div><div class="bubble">${escapeHtml(text)}</div>`;
    chatBody.appendChild(row);
    scrollDown();
}

function addUserMsg(text) {
    const row = document.createElement('div');
    row.className = 'msg-row user';
    row.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
    chatBody.appendChild(row);
    scrollDown();
}

function copyMsg(btn, encoded) {
    const text = decodeURIComponent(encoded);
    navigator.clipboard.writeText(text).then(() => {
        btn.textContent = '✓ 已複製';
        btn.classList.add('copied');
        setTimeout(() => { btn.textContent = '複製'; btn.classList.remove('copied'); }, 1500);
    });
}

function scrollDown() {
    requestAnimationFrame(() => { chatBody.scrollTop = chatBody.scrollHeight; });
}

function escapeHtml(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

msgInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.isComposing) sendMessage();
});

init();

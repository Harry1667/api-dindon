<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EE">
<title>選科別</title>
<link rel="stylesheet" href="/simple-static/simple.css?v=1776991770">
</head>
<body class="layout-fixed">

<div class="top">
  <header class="bar">
    <button class="back" onclick="back()"><span class="arrow">‹</span><span class="label">返回</span></button>
    <div class="brand" id="hospName">叮咚到號</div>
  </header>
  <div class="title" style="margin:6px 4px 0">您要看哪一科？</div>
  <div class="step">第 2 步，共 4 步</div>
</div>

<div class="scroll">
  <div class="cards two-col" id="cards"><div class="spinner-wrap"><div class="spinner"></div></div></div>
</div>


<script src="/simple-static/simple.js?v=1776991770"></script>
<script>
const setup = getSetup();
if (!setup.hospital_code) go('/simple');
document.getElementById('hospName').textContent = setup.hospital_name || '';

let depts = [];     // [{ display, full }]
let activeDepts = new Set();  // 目前有診的科別（full name）

(async function init() {
  try {
    const pref = setup.branch_prefix || '';
    const raw = await fetchDepartments(setup.hospital_code);
    const rawList = raw.map(d => typeof d === 'string' ? d : (d.name || d.department || ''));
    if (pref) {
      depts = rawList
        .filter(n => n.startsWith(pref))
        .map(n => ({ full: n, display: n.slice(pref.length).trim() || n }));
    } else {
      depts = rawList.map(n => ({ full: n, display: n }));
    }
    await refreshActiveDepts();  // 第一次抓目前休診狀態並 render
  } catch (e) {
    document.getElementById('cards').innerHTML = `<div class="empty">無法取得科別資料<br>請返回重試</div>`;
  }
})();

async function refreshActiveDepts() {
  try {
    const progress = await fetchProgress(setup.hospital_code);
    activeDepts = new Set();
    progress.forEach(r => { if (r.department) activeDepts.add(r.department); });
    render();
  } catch {}
}

setInterval(refreshActiveDepts, 60000);
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) refreshActiveDepts();
});

function render() {
  const el = document.getElementById('cards');
  if (!depts.length) { el.innerHTML = `<div class="empty">目前沒有科別資料</div>`; return; }
  const scope = setup.hospital_code + (setup.branch_prefix ? ':' + setup.branch_prefix : '');
  // 排序：開診優先，其次點擊次數
  const sorted = depts
    .map((d, idx) => {
      const closed = activeDepts.size > 0 && !activeDepts.has(d.full);
      const picks  = pickCount('dept', scope, d.display);
      return { d, idx, closed, picks };
    })
    .sort((a, b) => {
      if (a.closed !== b.closed) return a.closed ? 1 : -1;
      if (a.picks  !== b.picks)  return b.picks - a.picks;
      return a.idx - b.idx;
    })
    .map(x => x.d);

  el.innerHTML = sorted.map(d => {
    const name = d.display;
    const closed = activeDepts.size > 0 && !activeDepts.has(d.full);
    const n = pickCount('dept', scope, name);
    const star = n >= 3 ? '⭐' : (n >= 1 ? '•' : '');
    const closedCls = closed ? ' closed' : '';
    const onclick = closed ? '' : `onclick="pick(this.dataset.name)"`;
    const closedBadge = closed ? `<span class="closed-tag">休診</span>` : '';
    return `<button class="card${closedCls}" data-name="${name.replace(/"/g, '&quot;')}" ${onclick} ${closed ? 'disabled aria-disabled="true"' : ''}>
      <div class="name">${name}${closedBadge}${star ? ` <span style="color:var(--accent);font-size:18px">${star}</span>` : ''}</div>
    </button>`;
  }).join('');
}

function pick(name) {
  const pref = setup.branch_prefix || '';
  const fullDept = pref ? (pref + name) : name;
  const scope = setup.hospital_code + (pref ? ':' + pref : '');
  bumpPick('dept', scope, name);
  saveSetup({ department: fullDept, department_display: name });
  go('/simple/doctor');
}
</script>
</body>
</html>

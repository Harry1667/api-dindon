<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF6EE">
<title>叮咚到號 · 追蹤中</title>
<link rel="stylesheet" href="/simple-static/simple.css?v=1776991770">
<style>
  /* === Design tokens（對齊 /simple）================================= */
  :root {
    --bg:        #FAF6EE;
    --ink:       #1A2B4A;
    --ink2:      #6A7286;
    --ink3:      #8A8F9E;
    --ink-soft:  #4A536B;
    --border:    #E3DCC9;
    --border2:   #EFEAD9;
    --card:      #FFFFFF;

    --accent:    #FF6B1A;   /* 主要 accent — 到號/快到/進度 active */
    --accent-d:  #C24C0E;
    --accent-dd: #8E3808;
    --accent-s:  #FFE9D8;   /* soft tint */
    --accent-r:  #FFD0B0;   /* ring */

    --ok:        #1B5E3A;   /* 狀態：已完成 */
    --ok-s:      #DDEEE3;

    --danger:    #D94848;
    --danger-d:  #9E2E2E;
    --danger-s:  #FDE3E3;

    --shadow-card: 0 4px 16px rgba(15, 25, 40, 0.05);
    --shadow-soft: 0 2px 8px rgba(15, 25, 40, 0.03);

    --r-lg: 28px; --r-md: 20px; --r-sm: 16px; --r-xs: 12px;
  }

  /* === Reset ======================================================== */
  *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  button { font: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    color: var(--ink);
    background: var(--bg);
    font-size: 16px; line-height: 1.5;
    min-height: 100vh;
    max-width: 460px;
    margin: 0 auto;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* === Top bar（極簡）=============================================== */
  .top {
    background: var(--bg);
    color: var(--ink);
    padding: 10px 16px;
    position: sticky; top: 0; z-index: 20;
    box-shadow: 0 1px 0 var(--border);
  }
  .top-row { display: flex; align-items: center; gap: 12px; height: 44px; }
  .back {
    height: 44px; padding: 0 14px;
    border-radius: 12px;
    background: #fff;
    border: 2px solid var(--border);
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--ink); font-weight: 700;
    transition: background .15s;
  }
  .back .arrow { font-size: 22px; line-height: 1; }
  .back .label { font-size: 16px; letter-spacing: 1px; }
  .back:active { background: var(--border2); }
  .top-row .brand {
    margin-left: auto; font-size: 18px; font-weight: 800;
    color: var(--ink); letter-spacing: 1px;
  }

  /* === 醫院資訊大卡（左：醫院/科別，右：醫生/診室）================= */
  .info-hero {
    margin: 12px 16px 14px;
    background: #fff;
    border: 2.5px solid var(--border);
    border-radius: var(--r-md);
    padding: 18px 18px;
    box-shadow: var(--shadow-card);
    display: flex; align-items: stretch; gap: 14px;
  }
  .info-hero .left,
  .info-hero .right {
    flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column; justify-content: center;
  }
  .info-hero .left  { padding-right: 12px; border-right: 1px dashed var(--border); }
  .info-hero .right { padding-left: 2px; }

  .info-hero .hosp {
    font-size: 28px; font-weight: 900; color: var(--ink);
    letter-spacing: -0.5px; line-height: 1.15;
    overflow-wrap: break-word;
  }
  .info-hero .dept {
    font-size: 20px; font-weight: 700; color: var(--ink-soft);
    margin-top: 8px; letter-spacing: 0.3px;
    overflow-wrap: break-word;
  }
  .info-hero .doc {
    font-size: 26px; font-weight: 800; color: var(--ink);
    letter-spacing: 0.3px; line-height: 1.15;
    overflow-wrap: break-word;
  }
  .info-hero .doc .tag {
    font-size: 16px; font-weight: 700; color: var(--ink2);
    margin-left: 5px; letter-spacing: 0.5px;
  }
  .info-hero .room {
    display: inline-block; margin-top: 10px;
    font-size: 20px; font-weight: 700; color: var(--accent-d);
    padding: 4px 14px; background: var(--accent-s);
    border-radius: 12px;
  }

  /* === Stat cards ==================================================== */
  .stats {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    padding: 0 16px;
    margin-top: 0;
    margin-bottom: 14px;
  }
  .stat {
    background: var(--card);
    border: 2px solid var(--border2);
    border-radius: var(--r-md);
    padding: 16px 14px 14px;
    text-align: center;
    box-shadow: var(--shadow-card);
  }
  .stat .lbl { font-size: 14px; color: var(--ink2); font-weight: 600; margin-bottom: 6px; letter-spacing: 0.5px; }
  .stat .val {
    font-size: 52px; font-weight: 900; color: var(--accent);
    line-height: 1; letter-spacing: -2.5px;
    font-variant-numeric: tabular-nums;
    min-height: 52px;
    display: flex; align-items: baseline; justify-content: center; gap: 4px;
  }
  .stat .val .unit { font-size: 20px; font-weight: 800; color: var(--accent-d); letter-spacing: 0; }
  .stat.passed .val, .stat.passed .val .unit { color: var(--danger); }
  .stat .sub { font-size: 12px; color: var(--ink3); margin-top: 4px; min-height: 16px; }

  /* === Section card =================================================== */
  /* 覆寫 simple.css 的 .card（那個有 width:100% 會搭 margin 溢出）*/
  .card {
    width: auto; min-height: 0;
    background: var(--card);
    border: 2px solid var(--border2);
    border-radius: var(--r-md);
    margin: 0 16px 14px;
    padding: 18px 18px 16px;
    box-shadow: var(--shadow-soft);
    display: block;           /* 蓋掉 simple.css 的 flex */
    cursor: default;
  }
  .card h2 {
    margin: 0 0 14px; font-size: 17px; font-weight: 800;
    color: var(--ink); letter-spacing: 0.3px;
  }

  /* === Progress steps =================================================== */
  .track { position: relative; padding: 6px 0 2px; }
  .track-line, .track-fill {
    position: absolute; top: 22px; height: 5px; border-radius: 3px;
  }
  .track-line { left: 10%; right: 10%; background: var(--border); z-index: 0; }
  .track-fill {
    left: 10%; width: 0;
    background: linear-gradient(90deg, var(--accent-d), var(--accent));
    z-index: 1;
    transition: width .45s cubic-bezier(.2,.7,.3,1);
  }
  .track-fill.passed { background: linear-gradient(90deg, var(--accent), var(--danger)); }

  .steps {
    position: relative; z-index: 2;
    display: grid; grid-template-columns: repeat(4, 1fr);
  }
  .step {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .step .ic {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--card);
    border: 3px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--ink3);
    transition: all .3s cubic-bezier(.2,.7,.3,1);
  }
  .step .ic svg { width: 20px; height: 20px; }
  .step.done .ic {
    background: var(--accent-s);
    border-color: var(--accent);
    color: var(--accent-d);
  }
  .step.active .ic {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    width: 52px; height: 52px;
    box-shadow: 0 0 0 6px var(--accent-r), 0 6px 14px rgba(255,107,26,0.35);
    transform: translateY(-4px);
  }
  .step.active .ic svg { width: 24px; height: 24px; }
  .step.passed .ic {
    background: var(--danger-s);
    border-color: var(--danger);
    color: var(--danger-d);
  }
  .step .lbl {
    font-size: 13px; font-weight: 700; color: var(--ink2);
    letter-spacing: 0.5px;
  }
  .step.done .lbl, .step.active .lbl { color: var(--accent-d); }
  .step.active .lbl { font-size: 14px; }
  .step.passed .lbl { color: var(--danger-d); }

  /* ETA */
  .eta {
    text-align: center;
    font-size: 17px; font-weight: 700; color: var(--ink);
    margin: 18px 4px 6px;
    padding-top: 14px;
    border-top: 1px dashed var(--border);
    letter-spacing: 0.3px;
  }
  .upd {
    display: flex; justify-content: center; align-items: center; gap: 10px;
    margin: 2px 0 0;
    font-size: 13px; color: var(--ink3);
  }
  .upd .refresh {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--accent-d); font-weight: 700; font-size: 13px;
    padding: 4px 10px; border-radius: 10px;
  }
  .upd .refresh:active { background: var(--accent-s); }

  /* === CTA ============================================================= */
  .cta {
    display: flex; align-items: center; gap: 14px;
    width: calc(100% - 32px);
    margin: 6px 16px 14px;
    padding: 16px 18px;
    border-radius: var(--r-sm);
    background: linear-gradient(180deg, var(--accent), var(--accent-d));
    color: #fff;
    box-shadow: 0 4px 0 var(--accent-dd), 0 10px 24px rgba(255,107,26,0.25);
    text-align: left;
    transition: transform .12s ease, box-shadow .2s;
  }
  .cta:active:not(:disabled) {
    transform: translateY(2px);
    box-shadow: 0 2px 0 var(--accent-dd), 0 6px 16px rgba(255,107,26,0.25);
  }

  .cta .cta-ic {
    width: 50px; height: 50px; border-radius: 50%;
    background: rgba(255,255,255,0.22);
    display: flex; align-items: center; justify-content: center;
    flex: 0 0 50px; color: #fff;
  }
  .cta .cta-ic svg { width: 26px; height: 26px; }
  .cta .cta-txt { flex: 1; min-width: 0; }
  .cta .cta-t { font-size: 22px; font-weight: 900; letter-spacing: 1px; line-height: 1.1; }
  .cta .cta-s { font-size: 14px; font-weight: 600; opacity: 0.93; margin-top: 3px; letter-spacing: 0.3px; }

  .cta.wait {
    background: linear-gradient(180deg, #F2EEE1, #E3DCC6);
    color: var(--ink-soft);
    box-shadow: 0 3px 0 #C9BFA3, var(--shadow-soft);
  }
  .cta.wait .cta-ic { background: rgba(26,43,74,0.08); color: var(--ink-soft); }

  .cta.pass {
    background: linear-gradient(180deg, var(--danger), var(--danger-d));
    box-shadow: 0 4px 0 #7A2121, 0 10px 24px rgba(217,72,72,0.25);
  }
  .cta.pass .cta-ic { background: rgba(255,255,255,0.22); }

  .cta.pulse { animation: cta-pulse 1.6s ease-in-out infinite; }
  @keyframes cta-pulse {
    0%,100% { box-shadow: 0 4px 0 var(--accent-dd), 0 0 0 0 rgba(255,107,26,0.55); }
    50%     { box-shadow: 0 4px 0 var(--accent-dd), 0 0 0 16px rgba(255,107,26,0); }
  }

  /* === Actions ========================================================= */
  .actions {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    padding: 0 16px; margin-top: 4px;
  }
  .action {
    height: 52px; border-radius: 14px;
    background: var(--card); border: 2px solid var(--border);
    color: var(--ink); font-size: 17px; font-weight: 700;
    transition: background .12s;
  }
  .action:active { background: var(--border2); }
  .action.danger { color: var(--danger-d); border-color: #F2C6C6; }
  .action.danger:active { background: var(--danger-s); }

  /* === Pending ========================================================= */
  .pending { text-align: center; padding: 28px 24px 24px; }
  .pending .emo { font-size: 56px; line-height: 1; margin-bottom: 10px; }
  .pending .t { font-size: 22px; font-weight: 800; color: var(--ink); margin-bottom: 8px; }
  .pending .s { font-size: 15px; color: var(--ink2); line-height: 1.7; }
  .dots { display: inline-flex; gap: 6px; margin-top: 14px; }
  .dots span {
    width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
    animation: dotAnim 1.2s infinite;
  }
  .dots span:nth-child(2) { animation-delay: .2s; }
  .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes dotAnim {
    0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1.2); }
  }

  .toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: rgba(26,43,74,0.95); color: #fff; padding: 14px 22px;
    border-radius: 14px; font-size: 18px; font-weight: 700;
    z-index: 9999; pointer-events: none; opacity: 0;
    transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header class="top">
  <div class="top-row">
    <button class="back" onclick="go('/simple')" aria-label="返回">
      <span class="arrow">‹</span><span class="label">返回</span>
    </button>
    <div class="brand">叮咚到號</div>
  </div>
</header>

<!-- 醫院資訊大框：左醫院+科別 / 右醫生+診室 -->
<div class="info-hero">
  <div class="left">
    <div class="hosp" id="hname">—</div>
    <div class="dept" id="hdept">—</div>
  </div>
  <div class="right">
    <div class="doc" id="hDoc">—</div>
    <div class="room" id="hRoom" style="display:none">—</div>
  </div>
</div>

<div id="mainView">
  <div class="stats">
    <div class="stat" id="cardCur">
      <div class="lbl">目前號碼</div>
      <div class="val"><span id="curNum">—</span><span class="unit">號</span></div>
      <div class="sub" id="curSub">&nbsp;</div>
    </div>
    <div class="stat" id="cardMine">
      <div class="lbl">您前面還有</div>
      <div class="val"><span id="ahead">—</span><span class="unit" id="aheadUnit">人</span></div>
      <div class="sub" id="aheadSub">您是第 <span id="myNumSub">—</span> 號</div>
    </div>
  </div>

  <div class="card">
    <h2>看診進度</h2>
    <div class="track">
      <div class="track-line"></div>
      <div class="track-fill" id="fill" style="width:0%"></div>
      <div class="steps" id="steps">
        <div class="step" data-k="registered">
          <div class="ic" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12.5l4.5 4.5L19 7"/>
            </svg>
          </div>
          <div class="lbl">已登錄</div>
        </div>
        <div class="step" data-k="seeing">
          <div class="ic" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <circle cx="12" cy="8" r="3.6"/>
              <path d="M4.5 20c.8-4 3.8-6 7.5-6s6.7 2 7.5 6z"/>
            </svg>
          </div>
          <div class="lbl">看診中</div>
        </div>
        <div class="step" data-k="near">
          <div class="ic" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 3.2a1.2 1.2 0 011.2 1.2v.6c2.9.6 5 3.1 5 6.1v2.9l2 2.6v1H3.8v-1l2-2.6v-2.9c0-3 2.1-5.5 5-6.1v-.6A1.2 1.2 0 0112 3.2zM10 19.5a2 2 0 004 0z"/>
            </svg>
          </div>
          <div class="lbl">快到您</div>
        </div>
        <div class="step" data-k="passed">
          <div class="ic" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 3v18"/>
              <path d="M5 4h11l-2 3.5L16 11H5"/>
            </svg>
          </div>
          <div class="lbl">已過號</div>
        </div>
      </div>
    </div>
    <div class="eta" id="eta">等候醫院資料中…</div>
    <div class="upd">
      最後更新 <span id="updTime">—</span>
      <button class="refresh" onclick="refresh(true)" aria-label="立即更新">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <path d="M3 12a9 9 0 0115.5-6.3L21 8"/>
          <path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 01-15.5 6.3L3 16"/>
          <path d="M3 21v-5h5"/>
        </svg>
        更新
      </button>
    </div>
  </div>

  <button class="cta wait" id="cta" onclick="refresh(true)" type="button">
    <div class="cta-ic" id="ctaIc">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
    </div>
    <div class="cta-txt">
      <div class="cta-t" id="ctaTitle">等候中</div>
      <div class="cta-s" id="ctaSub">請您稍候看診進度</div>
    </div>
  </button>
</div>

<div id="pendingView" style="display:none">
  <div class="card pending">
    <div class="emo">⏳</div>
    <div class="t">等候醫院系統資料</div>
    <div class="s">目前尚未抓到這位醫生的叫號資訊<br>可能是尚未開診或剛結束<br>頁面每 30 秒自動更新</div>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
</div>

<div class="actions">
  <button class="action" onclick="go('/simple')" type="button">追加其他</button>
  <button class="action danger" onclick="stopTrack()" type="button">停止追蹤</button>
</div>

<script src="/simple-static/simple.js?v=1776991770"></script>
<script>
// 支援 ?id=<track_id> 顯示單一追蹤；無 id 則顯示最新
pruneExpiredTracks();
const qs = new URLSearchParams(location.search);
const qid = qs.get('id');
let last;
if (qid) {
  last = findTrack(qid);
} else {
  const tracks = getTracks();
  last = tracks.length ? tracks[tracks.length - 1] : null;
  if (last) location.replace('/simple/tracking?id=' + last.track_id);
}
if (!last) go('/simple');

document.getElementById('hname').textContent = last.hospital_name || '';
document.getElementById('hdept').textContent = last.department_display || last.department || '';
const docEl = document.getElementById('hDoc');
if (last.doctor_name) {
  docEl.innerHTML = `${last.doctor_name}<span class="tag">醫師</span>`;
} else {
  docEl.textContent = '—';
}
if (last.clinic_room) {
  const roomEl = document.getElementById('hRoom');
  roomEl.style.display = 'inline-block';
  roomEl.textContent = last.clinic_room;
}
document.getElementById('myNumSub').textContent = last.user_number;

const ICON = {
  clock:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
  person: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c.8-4 3.8-6 7.5-6s6.7 2 7.5 6z"/></svg>',
  bell:   '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2a1.2 1.2 0 011.2 1.2v.6c2.9.6 5 3.1 5 6.1v2.9l2 2.6v1H3.8v-1l2-2.6v-2.9c0-3 2.1-5.5 5-6.1v-.6A1.2 1.2 0 0112 3.2zM10 19.5a2 2 0 004 0z"/></svg>',
  warn:   '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 21h20z"/><path d="M12 9v6m0 3v.5" stroke="#fff" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>',
};

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function nowHHMM() { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }

/* 每個 step 中心在 .track 寬度的 12.5% / 37.5% / 62.5% / 87.5%
   .track-fill 從 10% 開始，所以 width 對應下面表。 */
const FILL = { waiting: 0, seeing: 28, near: 53, yours: 53, passed: 78 };

function setStage(stage) {
  const steps = document.querySelectorAll('.step');
  steps.forEach(s => s.classList.remove('done', 'active', 'passed'));
  const fill = document.getElementById('fill');
  fill.classList.remove('passed');

  if (stage === 'waiting') {
    steps[0].classList.add('active');
  } else if (stage === 'seeing') {
    steps[0].classList.add('done');
    steps[1].classList.add('active');
  } else if (stage === 'near' || stage === 'yours') {
    steps[0].classList.add('done');
    steps[1].classList.add('done');
    steps[2].classList.add('active');
  } else if (stage === 'passed') {
    steps[0].classList.add('done');
    steps[1].classList.add('done');
    steps[2].classList.add('done');
    steps[3].classList.add('passed');
    fill.classList.add('passed');
  }
  fill.style.width = (FILL[stage] || 0) + '%';
}

function setCta(kind, title, sub, icon) {
  const cta = document.getElementById('cta');
  cta.classList.remove('wait', 'pass', 'pulse');
  if (kind === 'wait')  cta.classList.add('wait');
  if (kind === 'pass')  cta.classList.add('pass');
  if (kind === 'alert') cta.classList.add('pulse');
  document.getElementById('ctaTitle').textContent = title;
  document.getElementById('ctaSub').textContent   = sub;
  document.getElementById('ctaIc').innerHTML      = icon;
}

function showMain() {
  document.getElementById('mainView').style.display = '';
  document.getElementById('pendingView').style.display = 'none';
}
function showPending() {
  document.getElementById('mainView').style.display = 'none';
  document.getElementById('pendingView').style.display = '';
}

let _prevCur = null;
let _hadMatch = false;
let _noMatchCount = 0;
let _passedAt = null;   // 首次偵測到 cur > my 的時間
let _pollTimer = null;

async function refresh(manual) {
  try {
    const list = await fetchProgress(last.hospital_code);
    const match = findMatchingRoom(list, last);

    document.getElementById('updTime').textContent = nowHHMM();

    if (!match) {
      _noMatchCount++;
      // 曾有匹配，現在連續 3 次抓不到 → 診已結束
      if (_hadMatch && _noMatchCount >= 3) {
        await autoEnd('doctor_gone', '這位醫生的看診資料已消失，診別可能已結束。');
        return;
      }
      showPending();
      return;
    }
    _hadMatch = true;
    _noMatchCount = 0;

    // 音效：到號/快到/過號都 dingdong；一般變動 ding；首次載入若已在警戒區補播一次
    const newCur = match.current_number || 0;
    const my  = last.user_number;
    const rem = my - newCur;
    const inAlert = newCur >= my;                 // 到號或過號
    const inNear  = rem > 0 && rem <= 3;          // 快到（3 人內）
    if (_prevCur === null) {
      if (inAlert || inNear) playDingDong();      // 頁面一載入就在警戒區（快到/到號/過號）→ 補播
    } else if (_prevCur !== newCur) {
      if (inAlert || inNear) playDingDong();      // 警戒區內任何變動都叮咚
      else playDing();                            // 還遠，單響
    }
    _prevCur = newCur;

    showMain();
    const cur = newCur;
    const ahead = Math.max(0, my - cur);

    document.getElementById('curNum').textContent = cur || '—';
    document.getElementById('ahead').textContent  = ahead;
    document.getElementById('aheadUnit').textContent = '人';
    document.getElementById('cardMine').classList.remove('passed');
    if (cur <= my) _passedAt = null;  // 沒過號就 reset 過號計時

    if (cur === 0) {
      setStage('waiting');
      setCta('wait', '尚未開始叫號', '醫師還沒開始看診，請稍候', ICON.clock);
      document.getElementById('eta').textContent = '醫師尚未開始看診';
    } else if (my < cur) {
      // 首次偵測過號 → 紀錄時間；持續過號 > 5 分鐘 → 自動結束追蹤
      if (_passedAt === null) _passedAt = Date.now();
      const passedFor = Date.now() - _passedAt;
      if (passedFor > 5 * 60 * 1000) {
        await autoEnd('passed', '您已過號，追蹤已自動結束。');
        return;
      }
      setStage('passed');
      document.getElementById('cardMine').classList.add('passed');
      document.getElementById('ahead').textContent = 0;
      const mins = Math.ceil((5 * 60 * 1000 - passedFor) / 60000);
      setCta('pass', '您已過號', `請儘速前往診間（${mins} 分鐘後自動結束）`, ICON.warn);
      document.getElementById('eta').textContent = `目前已看到第 ${cur} 號`;
    } else if (ahead === 0) {
      setStage('yours');
      setCta('alert', '輪到您了！', '請立即前往診間報到', ICON.bell);
      document.getElementById('eta').textContent = '請立即前往診間';
    } else if (ahead <= 3) {
      setStage('near');
      setCta('alert', '快到號囉！', '建議準備前往診間', ICON.bell);
      document.getElementById('eta').textContent = `預估 ${ahead * 3}-${ahead * 6} 分鐘後到您`;
    } else {
      setStage('seeing');
      setCta('wait', '看診中 請耐心等候', `還有 ${ahead} 人`, ICON.person);
      document.getElementById('eta').textContent = `預估 ${ahead * 3}-${ahead * 8} 分鐘後到您`;
    }
  } catch (e) {
    if (manual) toast('網路不穩，請稍後再試');
  }
}

async function autoEnd(reason, message) {
  if (_pollTimer) { clearInterval(_pollTimer); _pollTimer = null; }
  try {
    if (last.track_id) {
      await fetch(`/api/track/${last.track_id}/stop`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ guest_id: getGuestId(), reason })
      });
    }
  } catch {}
  if (last.track_id) removeTrack(last.track_id);
  playDingDong();
  await ddAlert(message + '\n\n追蹤已自動停止。', '看診結束');
  go('/simple');
}

async function stopTrack() {
  const ok = await ddConfirm(
    `${last.hospital_name || ''} · ${last.doctor_name || ''}\n您的號碼 ${last.user_number}\n\n確定要停止這筆追蹤嗎？`,
    '停止追蹤'
  );
  if (!ok) return;
  try {
    if (last.track_id) {
      await fetch(`/api/track/${last.track_id}/stop`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ guest_id: getGuestId(), reason: 'cancelled' })
      });
    }
  } catch {}
  if (last.track_id) removeTrack(last.track_id);
  go('/simple');
}

refresh(false);
_pollTimer = setInterval(() => refresh(false), 30000);
window.addEventListener('pagehide', () => { if (_pollTimer) clearInterval(_pollTimer); });
</script>

version: "3.8"

services:
  # === FastAPI 主應用（LINE Webhook + Admin）===
  app:
    image: ajz-dindon:latest
    container_name: medqueue-app
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # === Celery Worker（爬蟲 + 通知 + 排程，合併省記憶體）===
  worker:
    image: ajz-dindon:latest
    container_name: medqueue-worker
    command: celery -A app.tasks.celery_app worker -B --loglevel=info --concurrency=2 -Q celery,notify --max-tasks-per-child=500
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

  # === Redis（快取 + 任務佇列）===
  redis:
    image: redis:7-alpine
    container_name: medqueue-redis
    ports:
      - "6399:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru

volumes:
  redis_data:

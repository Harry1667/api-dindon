<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>叮咚到號 — LINE 模擬測試</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: #E8ECF0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.phone-frame {
    width: 400px;
    height: 780px;
    background: #7494C0;
    border-radius: 32px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
    border: 8px solid #2C2C2C;
}

/* ===== Header ===== */
.chat-header {
    background: #06C755;
    color: white;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
}
.chat-header .avatar {
    width: 42px; height: 42px;
    border-radius: 50%;
    background: white;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
}
.chat-header .info h3 { font-size: 16px; font-weight: 600; }
.chat-header .info span { font-size: 11px; opacity: 0.85; }

/* ===== Chat Body ===== */
.chat-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #7494C0;
}

.msg-row {
    display: flex; gap: 8px; max-width: 88%;
    animation: msgIn 0.25s ease-out;
}
@keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
}
.msg-row.bot  { align-self: flex-start; }
.msg-row.user { align-self: flex-end; flex-direction: row-reverse; }

.msg-row .bubble-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: white; display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0; margin-top: 2px;
}
.msg-row.user .bubble-avatar { display: none; }

.bubble {
    padding: 10px 14px; border-radius: 18px;
    font-size: 14px; line-height: 1.55;
    white-space: pre-wrap; word-break: break-word;
}
.msg-row.bot .bubble  { background: white; color: #333; border-bottom-left-radius: 4px; }
.msg-row.user .bubble { background: #06C755; color: white; border-bottom-right-radius: 4px; }

.msg-time {
    font-size: 10px; color: rgba(255,255,255,0.7);
    align-self: flex-end; flex-shrink: 0;
}

/* ===== Quick Actions ===== */
.quick-actions {
    padding: 8px 16px;
    display: flex; gap: 8px; overflow-x: auto;
    background: #7494C0; flex-shrink: 0;
}
.quick-btn {
    padding: 7px 14px; border-radius: 20px;
    border: 1.5px solid white; color: white;
    font-size: 13px; cursor: pointer;
    white-space: nowrap;
    background: rgba(255,255,255,0.12);
    transition: all 0.2s;
}
.quick-btn:hover { background: rgba(255,255,255,0.3); }

/* ===== Input ===== */
.chat-input-area {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; background: #F7F7F7;
    border-top: 1px solid #E0E0E0; flex-shrink: 0;
}
.chat-input-area input {
    flex: 1; padding: 10px 16px;
    border: 1px solid #DDD; border-radius: 24px;
    font-size: 14px; outline: none; background: white;
}
.chat-input-area input:focus { border-color: #06C755; }

.send-btn {
    width: 42px; height: 42px; border-radius: 50%;
    border: none; background: #06C755; color: white;
    font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s; flex-shrink: 0;
}
.send-btn:hover { background: #05B54C; }
.send-btn:disabled { background: #CCC; cursor: not-allowed; }

/* ===== Typing ===== */
.typing-indicator { display: flex; gap: 4px; padding: 12px 16px; }
.typing-indicator .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #999; animation: bounce 1.2s infinite;
}
.typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
.typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
}

/* ===== Status bar ===== */
.status-bar {
    background: rgba(0,0,0,0.15);
    padding: 4px 16px;
    font-size: 10px;
    color: rgba(255,255,255,0.7);
    text-align: center;
    flex-shrink: 0;
}

/* Scrollbar */
.chat-body::-webkit-scrollbar { width: 4px; }
.chat-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 2px; }
</style>
</head>
<body>
<div class="phone-frame">
    <div class="chat-header">
        <div class="avatar">🔔</div>
        <div class="info">
            <h3>叮咚到號</h3>
            <span>醫院看診進度即時通知</span>
        </div>
    </div>

    <div class="status-bar" id="statusBar">連線模式：直連後端 (python demo_chat.py)</div>

    <div class="chat-body" id="chatBody"></div>

    <div class="quick-actions">
        <div class="quick-btn" onclick="sendQuick('醫院')">🏥 醫院列表</div>
        <div class="quick-btn" onclick="sendQuick('台北長庚')">台北長庚</div>
        <div class="quick-btn" onclick="sendQuick('追蹤 台北長庚 中醫內兒科 游汶霖')">🔔 追蹤游汶霖</div>
        <div class="quick-btn" onclick="sendQuick('取消追蹤')">⏹ 取消追蹤</div>
    </div>

    <div class="chat-input-area">
        <input type="text" id="msgInput" placeholder="輸入醫院名稱查詢..." autocomplete="off">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">▶</button>
    </div>
</div>

<script>
const chatBody = document.getElementById('chatBody');
const msgInput = document.getElementById('msgInput');
const sendBtn  = document.getElementById('sendBtn');
const statusBar = document.getElementById('statusBar');

// ============ Config ============
const API_BASE = 'http://localhost:5000';  // python demo_chat.py

// ============ On Load ============
window.onload = async () => {
    // Check if backend is available
    let backendOk = false;
    try {
        const r = await fetch(API_BASE + '/api/chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: 'test'}),
        });
        if (r.ok) backendOk = true;
    } catch(e) {}

    if (backendOk) {
        statusBar.textContent = '✅ 已連接後端 (localhost:5000)';
        statusBar.style.background = 'rgba(6,199,85,0.3)';
    } else {
        statusBar.textContent = '⚠️ 後端未啟動，使用純前端模式（直連醫院 API）';
        statusBar.style.background = 'rgba(255,165,0,0.3)';
    }
    window._backendOk = backendOk;

    addBotMsg(
        "👋 您好！我是叮咚到號小幫手\n\n" +
        "📋 點選下方按鈕或輸入醫院名稱\n" +
        "🔍 即時查詢看診進度\n\n" +
        "💡 支援：台北長庚、林口長庚、高雄長庚\n" +
        "　　新北板橋、新北三重"
    );
};

// ============ UI Helpers ============
function getTimeStr() {
    const d = new Date();
    return d.getHours().toString().padStart(2,'0') + ':' +
           d.getMinutes().toString().padStart(2,'0');
}

function esc(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
}

function addBotMsg(text) {
    const r = document.createElement('div');
    r.className = 'msg-row bot';
    r.innerHTML = `
        <div class="bubble-avatar">🔔</div>
        <div class="bubble">${esc(text)}</div>
        <span class="msg-time">${getTimeStr()}</span>`;
    chatBody.appendChild(r);
    chatBody.scrollTop = chatBody.scrollHeight;
}

function addUserMsg(text) {
    const r = document.createElement('div');
    r.className = 'msg-row user';
    r.innerHTML = `
        <div class="bubble">${esc(text)}</div>
        <span class="msg-time">${getTimeStr()}</span>`;
    chatBody.appendChild(r);
    chatBody.scrollTop = chatBody.scrollHeight;
}

function addTyping() {
    const r = document.createElement('div');
    r.className = 'msg-row bot'; r.id = 'typingRow';
    r.innerHTML = `
        <div class="bubble-avatar">🔔</div>
        <div class="bubble">
            <div class="typing-indicator">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
        </div>`;
    chatBody.appendChild(r);
    chatBody.scrollTop = chatBody.scrollHeight;
}

function removeTyping() {
    const el = document.getElementById('typingRow');
    if (el) el.remove();
}

// ============ Message Handling ============
async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text) return;
    addUserMsg(text);
    msgInput.value = '';
    sendBtn.disabled = true;
    addTyping();

    let reply;
    try {
        if (window._backendOk) {
            // Use Flask backend
            const resp = await fetch(API_BASE + '/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: text}),
            });
            const data = await resp.json();
            reply = data.reply;
        } else {
            // Fallback: client-side processing
            reply = await handleMessageLocal(text);
        }
    } catch(e) {
        reply = '❌ 連線錯誤：' + e.message + '\n\n請確認已執行：python demo_chat.py';
    }

    removeTyping();
    addBotMsg(reply);
    sendBtn.disabled = false;
    msgInput.focus();
}

function sendQuick(text) {
    msgInput.value = text;
    sendMessage();
}

msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
});

// ============ Client-side Fallback (no backend) ============
const BRANCHES = {
    '台北長庚': '1', '林口長庚': '3', '高雄長庚': '8',
};
const NTPC = {
    '板橋': ['00f8fa51-cedc-4c1d-88b0-58c55f740b79', '新北聯合醫院(板橋)'],
    '三重': ['0abdf2d0-3246-4614-b715-d4ed6631eb16', '新北聯合醫院(三重)'],
};
const DEPT_CODES = ['02','03','04','05','06','07','08','09','13'];

// ============ Tracking State ============
const tracking = {
    active: false,
    intervalId: null,
    hospitalName: '',
    branchId: '',
    deptFilter: '',
    doctorFilter: '',
    // 記住上次的號碼，只在變動時通知
    lastCurN: -1,
    lastNxtN: -1,
    lastCurSkip: false,
    lastNxtSkip: false,
    // 記住找到醫生時的 dept code 和 time code，後續只查這組
    foundDeptCode: null,
    foundTimeCode: null,
    pollCount: 0,
};

const POLL_INTERVAL = 15000; // 15 秒輪詢一次

function stopTracking() {
    if (tracking.intervalId) {
        clearInterval(tracking.intervalId);
        tracking.intervalId = null;
    }
    tracking.active = false;
    tracking.lastCurN = -1;
    tracking.lastNxtN = -1;
    tracking.foundDeptCode = null;
    tracking.foundTimeCode = null;
    tracking.pollCount = 0;
    statusBar.textContent = '⚠️ 純前端模式（直連醫院 API）';
    statusBar.style.background = 'rgba(255,165,0,0.3)';
}

async function startTracking(hospitalName, branchId, deptFilter, doctorFilter) {
    // 先停掉舊的
    stopTracking();

    tracking.hospitalName = hospitalName;
    tracking.branchId = branchId;
    tracking.deptFilter = deptFilter;
    tracking.doctorFilter = doctorFilter;
    tracking.active = true;

    // 第一次全掃，找到醫生並記錄 dept code + time code
    addBotMsg(`🔍 正在搜尋 ${hospitalName} ${deptFilter} ${doctorFilter}...`);

    const found = await findDoctorSlot(branchId, deptFilter, doctorFilter);
    if (!found) {
        addBotMsg(`❌ 找不到 ${doctorFilter} 的看診資料\n可能尚未開始看診或已結束\n\n追蹤已取消`);
        stopTracking();
        return;
    }

    tracking.foundDeptCode = found.deptCode;
    tracking.foundTimeCode = found.timeCode;
    tracking.lastCurN = found.curN;
    tracking.lastNxtN = found.nxtN;
    tracking.lastCurSkip = found.curSkip;
    tracking.lastNxtSkip = found.nxtSkip;

    // 先顯示一次目前的看診進度
    const now = new Date();
    const ts = (now.getMonth()+1).toString().padStart(2,'0') + '/' +
               now.getDate().toString().padStart(2,'0') + ' ' +
               now.getHours().toString().padStart(2,'0') + ':' +
               now.getMinutes().toString().padStart(2,'0');
    let numInfo = formatNumInfo(found.curN, found.nxtN, found.curSkip, found.nxtSkip);
    addBotMsg(
        `🏥 ${hospitalName} 看診進度\n` +
        `⏰ ${ts}\n\n` +
        `📌 ${found.dept}\n` +
        `  👨‍⚕️ ${doctorFilter} [${found.room}] ${found.session}\n` +
        `  ${numInfo}`
    );

    // 再顯示追蹤確認
    addBotMsg(
        `✅ 已開始追蹤 ${doctorFilter}\n\n` +
        `🔄 每 ${POLL_INTERVAL/1000} 秒自動檢查\n` +
        `📢 號碼變動時會自動通知\n` +
        `💡 輸入「取消追蹤」可停止`
    );

    statusBar.textContent = `🔔 追蹤中：${doctorFilter} | 每${POLL_INTERVAL/1000}秒檢查`;
    statusBar.style.background = 'rgba(6,199,85,0.3)';

    // 開始定時輪詢
    tracking.intervalId = setInterval(() => pollTrackedDoctor(), POLL_INTERVAL);
}

async function findDoctorSlot(branchId, deptFilter, doctorFilter) {
    const now = new Date();
    const hour = now.getHours();
    let times = hour < 12 ? ['1'] : hour < 17 ? ['1','2'] : ['2','3'];
    const timeNames = {'1':'上午診','2':'下午診','3':'夜診'};

    for (const tc of times) {
        for (const dc of DEPT_CODES) {
            try {
                const formData = new URLSearchParams();
                formData.append('dept', dc);
                formData.append('time', tc);
                const resp = await fetch(`https://register.cgmh.org.tw/Progress/${branchId}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: formData,
                });
                const html = await resp.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const table = doc.querySelector('table');
                if (!table) continue;
                const rows = table.querySelectorAll('tr');
                for (let i = 1; i < rows.length; i++) {
                    const cells = rows[i].querySelectorAll('td');
                    if (cells.length < 5) continue;
                    const dept = cells[0].textContent.trim();
                    const loc = cells[1].textContent.trim();
                    const doc_ = cells[2].textContent.trim();
                    const curT = cells[3].textContent.trim();
                    const nxtT = cells[4].textContent.trim();

                    // 比對醫師名
                    if (!doc_.includes(doctorFilter)) continue;
                    // 比對科別（如果有指定）
                    if (deptFilter && !dept.includes(deptFilter)) continue;

                    const curN = parseInt((curT.match(/\d+/)||[0])[0]) || 0;
                    const nxtN = parseInt((nxtT.match(/\d+/)||[0])[0]) || 0;
                    let room = loc;
                    if (loc.includes('\uff0f')) room = loc.split('\uff0f')[0].trim();
                    else if (loc.includes('/')) room = loc.split('/')[0].trim();

                    return {
                        dept, doctor: doc_, room,
                        session: timeNames[tc],
                        curN, nxtN,
                        curSkip: curT.includes('過號'),
                        nxtSkip: nxtT.includes('過號'),
                        deptCode: dc, timeCode: tc,
                    };
                }
            } catch(e) {}
        }
    }
    return null;
}

async function pollTrackedDoctor() {
    if (!tracking.active) return;
    tracking.pollCount++;

    try {
        const formData = new URLSearchParams();
        formData.append('dept', tracking.foundDeptCode);
        formData.append('time', tracking.foundTimeCode);
        const resp = await fetch(`https://register.cgmh.org.tw/Progress/${tracking.branchId}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/x-www-form-urlencoded'},
            body: formData,
        });
        const html = await resp.text();
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');
        const table = doc.querySelector('table');
        if (!table) {
            // 可能看診結束
            addBotMsg(`⚠️ [第${tracking.pollCount}次] 查無資料，可能看診已結束`);
            stopTracking();
            addBotMsg('🔕 追蹤已自動停止');
            return;
        }

        const rows = table.querySelectorAll('tr');
        let found = false;
        for (let i = 1; i < rows.length; i++) {
            const cells = rows[i].querySelectorAll('td');
            if (cells.length < 5) continue;
            const dept = cells[0].textContent.trim();
            const doc_ = cells[2].textContent.trim();

            if (!doc_.includes(tracking.doctorFilter)) continue;
            if (tracking.deptFilter && !dept.includes(tracking.deptFilter)) continue;

            const curT = cells[3].textContent.trim();
            const nxtT = cells[4].textContent.trim();
            const curN = parseInt((curT.match(/\d+/)||[0])[0]) || 0;
            const nxtN = parseInt((nxtT.match(/\d+/)||[0])[0]) || 0;
            const curSkip = curT.includes('過號');
            const nxtSkip = nxtT.includes('過號');

            found = true;

            // 比對是否有變動
            if (curN !== tracking.lastCurN || nxtN !== tracking.lastNxtN
                || curSkip !== tracking.lastCurSkip || nxtSkip !== tracking.lastNxtSkip) {

                const oldInfo = formatNumInfo(tracking.lastCurN, tracking.lastNxtN, tracking.lastCurSkip, tracking.lastNxtSkip);
                const newInfo = formatNumInfo(curN, nxtN, curSkip, nxtSkip);
                const ts = getTimeStr();

                addBotMsg(
                    `🔔 號碼更新！\n\n` +
                    `👨‍⚕️ ${tracking.doctorFilter}\n` +
                    `⏰ ${ts}\n\n` +
                    `舊：${oldInfo}\n` +
                    `新：${newInfo}\n\n` +
                    `📊 第 ${tracking.pollCount} 次檢查`
                );

                // 更新記錄
                tracking.lastCurN = curN;
                tracking.lastNxtN = nxtN;
                tracking.lastCurSkip = curSkip;
                tracking.lastNxtSkip = nxtSkip;
            }
            // 更新 status bar 顯示最後檢查時間
            statusBar.textContent = `🔔 追蹤中：${tracking.doctorFilter} | ${getTimeStr()} 第${tracking.pollCount}次 ${formatNumInfo(curN, nxtN, curSkip, nxtSkip)}`;
            break;
        }

        if (!found) {
            addBotMsg(`⚠️ [第${tracking.pollCount}次] 找不到 ${tracking.doctorFilter}，可能已休診`);
            stopTracking();
            addBotMsg('🔕 追蹤已自動停止');
        }
    } catch(e) {
        // 網路錯誤不停止，繼續嘗試
        statusBar.textContent = `🔔 追蹤中：${tracking.doctorFilter} | ⚠️ 連線重試中...`;
    }
}

function formatNumInfo(curN, nxtN, curSkip, nxtSkip) {
    if (curN > 0) {
        let s = `👉 ${curN}號`;
        if (curSkip) s += '(過號)';
        if (nxtN > 0 && nxtN !== curN) {
            s += ` → ${nxtN}號`;
            if (nxtSkip) s += '(過號)';
        }
        return s;
    } else if (nxtN > 0) {
        let s = `⏳ 下一位${nxtN}號`;
        if (nxtSkip) s += '(過號)';
        return s;
    }
    return '尚未開始';
}

async function handleMessageLocal(msg) {
    const m = msg.trim();

    // === 取消追蹤 ===
    if (m.includes('取消追蹤') || m.includes('停止追蹤') || m === '取消' || m === '停止') {
        if (tracking.active) {
            const name = tracking.doctorFilter;
            stopTracking();
            return `🔕 已取消追蹤 ${name}\n\n可隨時重新追蹤`;
        }
        return '目前沒有追蹤中的醫師';
    }

    // === 追蹤指令 ===
    if (m.includes('追蹤')) {
        // 解析：追蹤 醫院名 科別 醫師
        let rest = m.replace('追蹤', '').trim();
        let hospitalName = '', branchId = '', deptFilter = '', doctorFilter = '';

        // 找醫院
        for (const [name, bid] of Object.entries(BRANCHES)) {
            if (rest.includes(name)) {
                hospitalName = name;
                branchId = bid;
                rest = rest.replace(name, '').trim();
                break;
            }
        }
        if (!branchId) {
            return '❌ 請指定醫院名稱\n\n格式：追蹤 台北長庚 科別 醫師名\n例：追蹤 台北長庚 中醫內兒科 游汶霖';
        }

        // 剩下的是「科別 醫師」或「醫師」
        const parts = rest.split(/\s+/).filter(Boolean);
        if (parts.length >= 2) {
            deptFilter = parts.slice(0, -1).join('');
            doctorFilter = parts[parts.length - 1];
        } else if (parts.length === 1) {
            doctorFilter = parts[0];
        } else {
            return '❌ 請指定醫師名\n\n格式：追蹤 台北長庚 科別 醫師名\n例：追蹤 台北長庚 中醫內兒科 游汶霖';
        }

        // 啟動追蹤（非同步，會自己 addBotMsg）
        startTracking(hospitalName, branchId, deptFilter, doctorFilter);
        return `⏳ 正在設定追蹤 ${hospitalName} ${deptFilter} ${doctorFilter}...`;
    }

    // === 追蹤狀態 ===
    if (m === '狀態' || m === '追蹤狀態') {
        if (tracking.active) {
            const info = formatNumInfo(tracking.lastCurN, tracking.lastNxtN, tracking.lastCurSkip, tracking.lastNxtSkip);
            return `🔔 追蹤中\n\n🏥 ${tracking.hospitalName}\n📌 ${tracking.deptFilter}\n👨‍⚕️ ${tracking.doctorFilter}\n${info}\n\n📊 已檢查 ${tracking.pollCount} 次`;
        }
        return '目前沒有追蹤中的醫師';
    }

    if (['醫院','列表','有哪些','支援'].some(k => m.includes(k))) {
        return "🏥 目前支援查詢的醫院：\n\n【長庚體系】\n• 台北長庚\n• 林口長庚\n• 高雄長庚\n\n【新北聯合醫院】\n• 板橋院區\n• 三重院區\n\n💡 輸入醫院名稱即可查詢\n💡 可加科別或醫師名篩選\n　例：台北長庚 中醫內兒科\n\n🔔 追蹤功能：\n　追蹤 台北長庚 中醫內兒科 游汶霖\n　→ 號碼變動時自動通知";
    }

    // 長庚
    for (const [name, bid] of Object.entries(BRANCHES)) {
        if (m.includes(name) || m.includes(name.substring(0,2))) {
            let filter = m.replace(name, '').trim();
            const res = await fetchChangGungClient(bid, name);
            return formatResultsFiltered(name, res, filter);
        }
    }

    // 新北
    for (const [key, [did, name]] of Object.entries(NTPC)) {
        if (m.includes(key) || m.includes(name)) {
            let filter = m.replace(name, '').replace(key, '').trim();
            const res = await fetchNtpcClient(did, name);
            return formatResultsFiltered(name, res, filter);
        }
    }

    return "👋 輸入「醫院」查看支援列表\n🔍 或輸入醫院名稱查詢看診進度\n💡 可加科別篩選，如：台北長庚 中醫\n\n🔔 追蹤醫師：\n　追蹤 台北長庚 中醫內兒科 游汶霖";
}

function formatResultsFiltered(name, results, filter) {
    // 如果有篩選關鍵字，過濾科別或醫師
    let filterLabel = '';
    if (filter) {
        const filtered = results.filter(r =>
            r.dept.includes(filter) || r.doctor.includes(filter)
        );
        if (filtered.length > 0) {
            results = filtered;
            filterLabel = filter;
        }
        // 沒匹配到就顯示全部
    }
    return formatResults(name, results, filterLabel);
}

async function fetchChangGungClient(branchId, name) {
    const now = new Date();
    const hour = now.getHours();
    let times = hour < 12 ? ['1'] : hour < 17 ? ['1','2'] : ['2','3'];
    const timeNames = {'1':'上午診','2':'下午診','3':'夜診'};
    let results = [];

    for (const tc of times) {
        for (const dc of DEPT_CODES) {
            try {
                const formData = new URLSearchParams();
                formData.append('dept', dc);
                formData.append('time', tc);
                const resp = await fetch(`https://register.cgmh.org.tw/Progress/${branchId}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: formData,
                });
                const html = await resp.text();
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');
                const table = doc.querySelector('table');
                if (!table) continue;
                const rows = table.querySelectorAll('tr');
                for (let i = 1; i < rows.length; i++) {
                    const cells = rows[i].querySelectorAll('td');
                    if (cells.length < 5) continue;
                    const dept = cells[0].textContent.trim();
                    const loc = cells[1].textContent.trim();
                    const doc_ = cells[2].textContent.trim();
                    const curT = cells[3].textContent.trim();
                    const nxtT = cells[4].textContent.trim();
                    if (!dept || !doc_) continue;
                    const curN = parseInt((curT.match(/\d+/)||[0])[0]) || 0;
                    const nxtN = parseInt((nxtT.match(/\d+/)||[0])[0]) || 0;
                    if (curN === 0 && nxtN === 0) continue;
                    let room_ = loc;
                    if (loc.includes('\uff0f')) room_ = loc.split('\uff0f')[0].trim();
                    else if (loc.includes('/')) room_ = loc.split('/')[0].trim();
                    results.push({
                        dept, doctor: doc_,
                        room: room_,
                        session: timeNames[tc],
                        curN, nxtN,
                        curSkip: curT.includes('過號'),
                        nxtSkip: nxtT.includes('過號'),
                    });
                }
            } catch(e) { /* CORS will likely block this */ }
        }
    }

    return results;
}

async function fetchNtpcClient(datasetId, name) {
    try {
        const resp = await fetch(`https://data.ntpc.gov.tw/api/datasets/${datasetId}/json?size=200`);
        const data = await resp.json();
        if (!Array.isArray(data)) return [];

        const opdMap = {'1':'上午診','2':'下午診','3':'夜診'};
        let results = [];
        for (const rec of data) {
            let dept = (rec.deptname||'').trim();
            if (dept.includes('_')) dept = dept.split('_')[1].trim();
            const doc = (rec.doctorname||'').trim();
            if (!dept || !doc) continue;
            const curN = parseInt(rec.callednumber_seqno) || 0;
            const wait = parseInt(rec.waitcount_person) || 0;
            if (curN === 0 && wait === 0) continue;
            results.push({
                dept, doctor: doc,
                room: (rec.roomname||'').trim(),
                session: opdMap[rec.opdtimeid] || '未知',
                curN, nxtN: curN > 0 ? curN+1 : 0,
                curSkip: false, nxtSkip: false,
                wait,
            });
        }
        return results;
    } catch(e) {
        return [];
    }
}

function formatResults(name, results, filterLabel) {
    const now = new Date();
    const ts = (now.getMonth()+1).toString().padStart(2,'0') + '/' +
               now.getDate().toString().padStart(2,'0') + ' ' +
               now.getHours().toString().padStart(2,'0') + ':' +
               now.getMinutes().toString().padStart(2,'0');

    if (results.length === 0) {
        return `🏥 ${name}\n⏰ 查詢時間：${ts}\n\n目前沒有看診中的診間資料\n（可能為非看診時段）`;
    }

    // Group by dept
    const byDept = {};
    for (const r of results) {
        if (!byDept[r.dept]) byDept[r.dept] = [];
        byDept[r.dept].push(r);
    }

    let lines = [`🏥 ${name} 看診進度`, `⏰ ${ts}　共 ${results.length} 個診間`];
    if (filterLabel) {
        lines.push(`🔎 篩選：${filterLabel}\n`);
    } else {
        lines.push('');
    }
    for (const [dept, items] of Object.entries(byDept).sort()) {
        lines.push(`📌 ${dept}`);
        for (const it of items) {
            let info;
            if (it.curN > 0) {
                info = `👉 ${it.curN}號`;
                if (it.curSkip) info += '(過號)';
                if (it.nxtN > 0 && it.nxtN !== it.curN) {
                    info += ` → ${it.nxtN}號`;
                    if (it.nxtSkip) info += '(過號)';
                }
            } else if (it.nxtN > 0) {
                info = `⏳ 下一位${it.nxtN}號`;
                if (it.nxtSkip) info += '(過號)';
            } else { continue; }
            let room = it.room || '';
            if (room.includes('\uff0f')) room = room.split('\uff0f')[0].trim();
            room = room ? ` [${room}]` : '';
            const sess = it.session !== '未知' ? ` ${it.session}` : '';
            lines.push(`  ${it.doctor}${room}${sess} ${info}`);
        }
        lines.push('');
    }
    return lines.join('\n');
}

version: "3.8"

services:
  # === FastAPI 主應用（測試 LINE@ 頻道）===
  app:
    build: .
    container_name: dindon-dev-app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    env_file:
      - .env.dev
    depends_on:
      - redis
    volumes:
      - .:/app
      - ./logs:/app/logs
      - ./data:/app/data
    restart: unless-stopped

  # === Celery Worker（爬蟲）===
  worker:
    build: .
    container_name: dindon-dev-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2 -Q celery
    env_file:
      - .env.dev
    depends_on:
      - redis
    volumes:
      - .:/app
      - ./logs:/app/logs
    restart: unless-stopped

  # === Celery Notify Worker（通知推播）===
  notify:
    build: .
    container_name: dindon-dev-notify
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=1 -Q notify
    env_file:
      - .env.dev
    depends_on:
      - redis
    volumes:
      - .:/app
      - ./logs:/app/logs
    restart: unless-stopped

  # === Celery Beat ===
  beat:
    build: .
    container_name: dindon-dev-beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file:
      - .env.dev
    depends_on:
      - redis
    volumes:
      - .:/app
      - ./logs:/app/logs
    restart: unless-stopped

  # === Redis ===
  redis:
    image: redis:7-alpine
    container_name: dindon-dev-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_dev_data:/data
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  redis_dev_data:

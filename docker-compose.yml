version: "3.8"

services:
  # === LINE Bot 測試版（demo_chat 測試資料）===
  linebot:
    build: .
    container_name: ajz-dindon
    command: uvicorn line_bot:app --host 0.0.0.0 --port 5000 --workers 1
    ports:
      - "5000:5000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # === FastAPI 主應用 ===
  app:
    build: .
    container_name: medqueue-app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  # === Celery Worker（執行爬蟲 + 推播任務）===
  worker:
    build: .
    container_name: medqueue-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  # === Celery Beat（定時排程器）===
  beat:
    build: .
    container_name: medqueue-beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  # === Redis（快取 + 任務佇列）===
  redis:
    image: redis:7-alpine
    container_name: medqueue-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  redis_data:

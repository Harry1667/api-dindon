[project]
name = "linebot-dindon"
version = "0.1.0"
description = "叮咚到號 — 醫院看診排隊 LINE 通知系統"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
